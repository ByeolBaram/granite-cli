[package]
name = "granite-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
paste = "1.0.15"
dialoguer = "0.11"
dirs = "5"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
num_cpus = "1"
sys-info = "0.9"
thiserror = "2"
schemars = "1.2.1"
ratatui = "0.30.2"
crossterm = "0.28"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
